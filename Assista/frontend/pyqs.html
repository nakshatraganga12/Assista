<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <title>PYQ</title>
    <style>
      body {
        font-family: 'Noto Sans', 'Lexend', sans-serif;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-[#101418] min-h-screen p-4">
    <div class="max-w-screen-md mx-auto space-y-6">
      <h2 class="text-xl font-bold text-center">Previous Year Questions</h2>

      <!-- Semester Dropdown -->
      <select
        id="semesterSelect"
        class="form-select w-full border rounded p-2 bg-white"
      >
        <option value="">Select Semester</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
      </select>

      <!-- Subject Dropdown -->
      <select
        id="subjectSelect"
        class="form-select w-full border rounded p-2 bg-white"
      >
        <option value="">Select Subject</option>
      </select>

      <!-- Year Dropdown -->
      <select
        id="yearSelect"
        class="form-select w-full border rounded p-2 bg-white"
      >
        <option value="">Select Year</option>
      </select>

      <!-- View PDF Button -->
      <button
        id="viewPdfBtn"
        class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
      >
        View PDF
      </button>

      <!-- PDF Viewer -->
      <div id="pdfContainer" class="mt-6 hidden">
        <iframe
          id="pdfViewer"
          src=""
          class="w-full h-[600px] border rounded"
        ></iframe>

        <!-- Toggle Answer Button -->
        <button
          id="toggleAnswerBtn"
          onclick="toggleAnswer()"
          class="ml-auto mt-2 text-sm text-blue-600 hover:underline focus:outline-none"
        >
          Show Answer
        </button>

        <!-- Hidden Answer Content -->
        <div
          id="answerSection"
          class="hidden mt-2 text-sm text-gray-700"
        >
          This is the answer or explanation for the selected paper.
        </div>
      </div>
    </div>

    <script>
      const semesterSubjects = {
        1: [
          "Matrices and Differential Calculus",
          "Programming for problem solving",
          "English",
          "Chemistry",
          "Essence of Indian Traditional Knowledge",
          "Environmental Science",
        ],
        2: [
          "Basic Electrical Engineering",
          "Scientific Programming",
          "Physics",
          "Differential Equations and Numerical Methods",
          "Indian Constitution",
        ],
      };

      const semesterSelect = document.getElementById("semesterSelect");
      const subjectSelect = document.getElementById("subjectSelect");
      const yearSelect = document.getElementById("yearSelect");
      const viewPdfBtn = document.getElementById("viewPdfBtn");
      const pdfViewer = document.getElementById("pdfViewer");
      const pdfContainer = document.getElementById("pdfContainer");

      // Populate years from current year to 2020
      const currentYear = new Date().getFullYear();
      for (let y = currentYear; y >= 2020; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }

      semesterSelect.addEventListener("change", () => {
        const selected = semesterSelect.value;
        subjectSelect.innerHTML = '<option value="">Select Subject</option>';
        if (semesterSubjects[selected]) {
          semesterSubjects[selected].forEach((subject) => {
            const opt = document.createElement("option");
            opt.value = subject;
            opt.textContent = subject;
            subjectSelect.appendChild(opt);
          });
        }
      });

      function sanitizeFilename(str) {
        return str.replace(/[^\w\s-]/g, "").replace(/\s+/g, "_");
      }

      viewPdfBtn.addEventListener("click", () => {
        const semester = semesterSelect.value;
        const subject = subjectSelect.value;
        const year = yearSelect.value;

        if (!semester || !subject) {
          alert("Please select both semester and subject.");
          return;
        }

        let pdfUrl = `pdfs/${semester}/${sanitizeFilename(subject)}`;
        if (year) {
          pdfUrl += `_${year}`;
        }
        pdfUrl += ".pdf";

        pdfViewer.src = pdfUrl;
        pdfContainer.classList.remove("hidden");

        document.getElementById("answerSection").classList.add("hidden");
        document.getElementById("toggleAnswerBtn").textContent = "Show Answer";
      });

      function toggleAnswer() {
        const answer = document.getElementById("answerSection");
        const btn = document.getElementById("toggleAnswerBtn");
        answer.classList.toggle("hidden");
        btn.textContent = answer.classList.contains("hidden")
          ? "Show Answer"
          : "Hide Answer";
      }
    </script>
  </body>
</html>
