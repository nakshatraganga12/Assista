<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Tracker</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900&display=swap"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      body {
        font-family: Inter, "Noto Sans", sans-serif;
        background-color: white;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
      }

      .floating-add-btn {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #667eea, #71c7df);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        z-index: 40;
        font-size: 24px;
        color:beige;
      }

      .floating-add-btn:hover {
        transform: scale(1.1) rotate(90deg);
        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
      }
    </style>
  </head>

  <body class="min-h-screen p-4">
    <div class="max-w-md mx-auto pb-24">
      <!-- Header -->
      <div class="glass-card mb-6 overflow-hidden">
        <div class="bg-white border-b border-gray-200 p-6 text-gray-800">
          <div class="flex items-center justify-between mb-4">
            <button
              onclick="window.location.href='dashboard.html'"
              class="text-gray-700 hover:text-gray-500 transition-colors"
            >
              &#8592;
            </button>
            <h2 class="text-xl font-bold">Assignment Tracker</h2>
            <div class="w-6"></div>
          </div>
          <div class="grid grid-cols-3 gap-4 text-center">
            <div class="bg-gray-100 rounded-lg p-3 text-gray-800">
              <div class="text-2xl font-bold" id="totalAssignments">0</div>
              <p class="text-xs">Total</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-3 text-gray-800">
              <div class="text-2xl font-bold text-orange-500" id="pendingAssignments">0</div>
              <p class="text-xs">Pending</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-3 text-gray-800">
              <div class="text-2xl font-bold text-green-500" id="completedAssignments">0</div>
              <p class="text-xs">Done</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Assignment List -->
      <div id="assignmentsList" class="space-y-4"></div>

      <!-- Floating Add Button -->
      <button class="floating-add-btn" onclick="showAddAssignmentModal()">
        +
      </button>
    </div>

    <!-- Add Assignment Modal -->
    <div
      id="addAssignmentModal"
      class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50"
    >
      <div class="glass-card p-6 w-full max-w-md">
        <h3 class="text-xl font-bold mb-6 text-gray-800">Add New Assignment</h3>
        <form id="addAssignmentForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Subject</label>
            <select
              id="assignmentSubject"
              class="w-full p-3 border border-gray-300 rounded-xl"
              required
            >
              <option value="">Select Subject</option>
              <option value="Mathematics-2">Mathematics-2</option>
              <option value="Engineering Physics">Engineering Physics</option>
              <option value="Scientific Programming">Scientific Programming</option>
              <option value="Basic Electrical Engineering">Basic Electrical Engineering</option>
              <option value="Indian Constitution">Indian Constitution</option>
              <option value="Engineering Graphics">Engineering Graphics</option>
            </select>
          </div>
          
            
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
            <input
              type="text"
              id="assignmentTitle"
              class="w-full p-3 border border-gray-300 rounded-xl"
              placeholder="Assignment title"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Submission Date</label>
            <input
              type="date"
              id="assignmentSubmissionDate"
              class="w-full p-3 border border-gray-300 rounded-xl"
              required
            />
          </div>
          <div class="flex justify-end">
            <button
              type="button"
              onclick="hideAddAssignmentModal()"
              class="mr-4 text-gray-600"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="bg-indigo-500 text-white px-4 py-2 rounded-xl"
            >
              Add
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let assignments = JSON.parse(localStorage.getItem("assignments")) || [];

      function showAddAssignmentModal() {
        document.getElementById('addAssignmentModal').classList.remove('hidden');
      }

      function hideAddAssignmentModal() {
        document.getElementById('addAssignmentModal').classList.add('hidden');
      }

      function saveAssignments() {
        localStorage.setItem("assignments", JSON.stringify(assignments));
      }

      function updateStats() {
          document.getElementById('totalAssignments').textContent = assignments.length;
          const pending = assignments.filter(a => a.status !== 'completed').length;
          const completed = assignments.filter(a => a.status === 'completed').length;
          document.getElementById('pendingAssignments').textContent = pending;
          document.getElementById('completedAssignments').textContent = completed;

          // Store the pending count in localStorage for dashboard.html to access
          localStorage.setItem('pendingAssignmentsCount', pending);
        }


      function renderAssignments() {
        const container = document.getElementById('assignmentsList');
        container.innerHTML = '';
        assignments.forEach((assignment, index) => {
          const card = document.createElement('div');
          card.className = 'glass-card p-4 flex items-center justify-between'; // Added flex and justify-between

          // Create flex container for checkbox and label
          const flexContainer = document.createElement("div");
          flexContainer.className = "flex items-center gap-2";

          // Create checkbox
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = assignment.status === "completed";
          checkbox.onchange = () => toggleStatus(index); // Call toggleStatus on change

          // Create label
          const label = document.createElement("label");
          const safeTitle = assignment.title || 'Untitled Assignment';
          label.textContent = safeTitle;
          label.className = checkbox.checked ? "line-through text-gray-500 text-base font-semibold" : "text-base font-semibold text-gray-800";

          flexContainer.appendChild(checkbox);
          flexContainer.appendChild(label);

          const subject = document.createElement('p');
          subject.className = 'text-sm text-gray-500';
          subject.textContent = `Subject: ${assignment.subject}`;

          // Delete Button
          const deleteBtn = document.createElement('button');
          deleteBtn.title = "Delete Assignment";
          deleteBtn.onclick = () => deleteAssignment(index);
          deleteBtn.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-red-500 hover:text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          `;

          card.appendChild(flexContainer); // Append flex container to card
          card.appendChild(subject);
          card.appendChild(deleteBtn); // Append delete button to card

          container.appendChild(card);
        });
      }

      function toggleStatus(index) {
        assignments[index].status = assignments[index].status === 'completed' ? 'pending' : 'completed';
        saveAssignments();
        renderAssignments();
        updateStats();
      }

      function deleteAssignment(index) {
        assignments.splice(index, 1);
        saveAssignments();
        renderAssignments();
        updateStats();
      }

      document.getElementById('addAssignmentForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const subject = document.getElementById('assignmentSubject').value;
        const title = document.getElementById('assignmentTitle').value;
        const submissionDate = document.getElementById('assignmentSubmissionDate').value;

        const newAssignment = {
          subject,
          title,
          submissionDate,
          status: 'pending',
        };

        assignments.push(newAssignment);
        saveAssignments();
        renderAssignments();
        updateStats();
        hideAddAssignmentModal();
        this.reset();
      });

      // Initial load
      renderAssignments();
      updateStats();
    </script>
  </body>
</html>
