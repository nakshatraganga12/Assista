<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leave Request & Status</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-[#101418] min-h-screen p-4">
    <div class="max-w-screen-md mx-auto space-y-12">
      <!-- Leave Request Section -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-center">Leave Request</h2>
        <form id="leaveForm" class="space-y-5">
          <div>
            <label class="block mb-1 font-medium">Name</label>
            <input id="name" name="name" type="text" required placeholder="Enter your full name"
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block mb-1 font-medium">Student ID</label>
            <input id="studentId" name="studentId" type="text" required placeholder="e.g., 123456"
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block mb-1 font-medium">Reason</label>
            <input id="reason" name="reason" type="text" required placeholder="e.g., Medical, Personal"
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block mb-1 font-medium">Type</label>
            <select id="type" name="type" required
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400">
              <option value="">Select</option>
              <option value="Casual">Casual</option>
              <option value="Sick">Sick</option>
            </select>
          </div>
          <div>
            <label class="block mb-1 font-medium">Start Date</label>
            <input id="startDate" name="startDate" type="date" required
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          </div>
          <div>
            <label class="block mb-1 font-medium">Time</label>
            <select id="time" name="time" required
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400">
              <option value="">Select</option>
              <option value="Full Day">Full Day</option>
              <option value="Half Day (Morning)">Half Day (Morning)</option>
              <option value="Half Day (Afternoon)">Half Day (Afternoon)</option>
            </select>
          </div>
          <div>
            <label class="block mb-1 font-medium">Attachment (Optional)</label>
            <input id="attachment" name="attachment" type="file"
              class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          </div>
          <div class="text-right">
            <button type="submit"
              class="bg-[#3f7fbf] text-white font-bold px-5 py-2 rounded-full hover:bg-[#336ca3] transition">
              Submit
            </button>
          </div>
        </form>
      </div>

      <!-- Status Checker Section -->
      <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-2xl font-bold mb-4 text-center">Check Leave Status</h2>
        <div class="space-y-4">
          <input id="checkStudentId" type="text" placeholder="Enter your Student ID"
            class="w-full h-12 rounded-xl bg-[#eaedf1] p-3 focus:ring-2 focus:ring-blue-400" />
          <div class="text-right">
            <button onclick="checkStatus()"
              class="bg-green-600 text-white font-bold px-5 py-2 rounded-full hover:bg-green-700 transition">
              Check Status
            </button>
          </div>
          <div id="statusResult" class="text-gray-800 text-sm mt-2"></div>
        </div>
      </div>
    </div>

    <script>
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzu9mLp7QomX1f7XA9ilpwn3eOsqR4hnXToQoXHVulUdJ63VeNNk_d269zc5qxTlj2yVQ/exec';

      // Leave Request Submit Handler
      const form = document.getElementById('leaveForm');
      // Replace the form submission handler (currently shows just an alert)
form.addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(form);
  
  fetch(BACKEND_URL, {
    method: 'POST',
    body: new URLSearchParams(formData)
  })
  .then(response => response.json())
  .then(data => {
    // NEW: Store the ID and show confirmation
    localStorage.setItem('lastStudentId', data.studentId);
    
    // Show success message
    const confirmation = `
      <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
        <strong>Submitted!</strong> 
        <p>Tracking ID: ${data.studentId}</p>
        <button onclick="checkStatus('${data.studentId}')" 
                class="mt-2 bg-green-500 text-white px-3 py-1 rounded">
          Check Status Now
        </button>
      </div>`;
    
    document.getElementById('confirmationMessage').innerHTML = confirmation;
    form.reset();
  })
  .catch(error => {
    alert('Submission error: ' + error.message);
  });
});
<div id="confirmationMessage" class="my-4"></div>

      // Status Checker
     function checkStatus(studentId) {
        document.getElementById('checkStudentId').value = studentId;
        const studentId = document.getElementById('checkStudentId').value.trim();
        const resultDiv = document.getElementById('statusResult');

        if (!studentId) {
          resultDiv.innerHTML = '<span class="text-red-500">Please enter your Student ID.</span>';
          return;
        }

        resultDiv.textContent = 'Loading...';

  fetch(`https://script.google.com/macros/s/AKfycbzu9mLp7QomX1f7XA9ilpwn3eOsqR4hnXToQoXHVulUdJ63VeNNk_d269zc5qxTlj2yVQ/exec?action=checkStatus&studentId=${encodeURIComponent(studentId)}`)
            .then(response => response.json())
          .then(data => {
            if (data.error) {
              resultDiv.innerHTML = `<span class="text-red-500">${data.error}</span>`;
            } else {
              resultDiv.innerHTML = `
                <div class="space-y-2">
                  <div><strong>Name:</strong> ${data.name}</div>
                  <div><strong>Reason:</strong> ${data.reason}</div>
                  <div><strong>Type:</strong> ${data.type}</div>
                  <div><strong>Start Date:</strong> ${data.startDate}</div>
                  <div><strong>Time:</strong> ${data.time}</div>
                  <div><strong>Overall Status:</strong> <span class="font-semibold">${data.status}</span></div>
                </div>
              `;
            }
          })
          .catch(err => {
            resultDiv.innerHTML = `<span class="text-red-500">Error: ${err.message}</span>`;
          });
      }
    </script>
<div id="recentSubmissions"></div>

<script>
const lastId = localStorage.getItem('lastStudentId');
if (lastId) {
  document.getElementById('checkStudentId').value = lastId;
  checkStatus(); // Auto-check status if ID exists
}
</script>
  </body>
</html>
