  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const rollNo = document.getElementById("rollNo").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const loginText = document.getElementById("loginText");
      const loading = document.getElementById("loading");

      // Show loading state
      loginText.style.display = "none";
      loading.style.display = "block";
      errorMsg.style.display = "none";

      // Simulate API call delay
      setTimeout(() => {
        const user = users.find(
          (u) => u.rollNo === rollNo && u.password === password
        );

        if (user) {
          localStorage.setItem("rollNo", user.rollNo); 
          localStorage.setItem("studentName", user.name);
          localStorage.setItem("studentRole", user.role);
          localStorage.setItem("studentTimetable", JSON.stringify(user.timetable));
          
          // Success animation
          loginText.textContent = "Success!";
          loginText.style.display = "block";
          loading.style.display = "none";
          
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 500);
        } else {
          // Error state
          loginText.style.display = "block";
          loading.style.display = "none";
          errorMsg.textContent = "Invalid roll number or password. Please try again.";
          errorMsg.style.display = "block";
          
          // Shake animation
          document.querySelector(".login-container").style.animation = "shake 0.5s";
          setTimeout(() => {
            document.querySelector(".login-container").style.animation = "";
          }, 500);
        }
      }, 1000);
    });

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
