        color: #5c738a;

        color: white;
      }

        border-radius: 0.25rem;
      }
      .available {
        background-color: #e6ffed;
        color: #166534;
      }
      .unavailable {
        background-color: #fee2e2;
        color: #991b1b;
      }

      function generateCustomTimetable() {
        const viewType = document.querySelector('.toggle-option.active').id.replace('Option', '');
        const resultsContainer = document.getElementById('customTimetableResults');
        resultsContainer.innerHTML = '';
        
        if (viewType === 'dayBased') {

            resultsContainer.innerHTML = '<div class="bg-white p-4 rounded-lg shadow-sm text-center text-red-500">Please select at least one time slot</div>';
            return;
          }
          
          const availableTeachers = findTeachersAvailableAtSlots(day, selectedSlots);
          displayCustomTimetableResults(availableTeachers, day, selectedSlots);
          
        } else { // hourBased

          const endTime = document.getElementById('endTime').value;

          const endHour = parseInt(endTime.split(':')[0]);
          const selectedSlots = [];

            const slotStart = parseInt(timeSlots[i].split(':')[0]);
            if (slotStart >= startHour && slotStart < endHour) {
              selectedSlots.push(i);
            }
          }
          
          if (selectedSlots.length === 0) {
            resultsContainer.innerHTML = '<div class="bg-white p-4 rounded-lg shadow-sm text-center text-red-500">No time slots match your selected time range</div>';
            return;
          }
          
          const availableTeachers = findTeachersAvailableAtSlots(day, selectedSlots);
          displayCustomTimetableResults(availableTeachers, day, selectedSlots);
        }
      }

function findTeachersAvailableAtSlots(day, slotIndices) {
  return teachers.map(teacher => {
    const availability = slotIndices.map(slotIndex => {
      const schedule = teacher.timetable[day] || [];
      return schedule[slotIndex] === "No class";
    });
    
    // Calculate availability metrics
    const allAvailable = availability.every(Boolean);
    const someAvailable = availability.some(Boolean);
    const availableCount = availability.filter(Boolean).length;
    const totalSlots = slotIndices.length;
    
    return {
      teacher,
      availability,
      allAvailable,
      someAvailable,
      availableCount,
      totalSlots,
      availabilityPercentage: Math.round((availableCount / totalSlots) * 100)
    };
  }).sort((a, b) => b.availableCount - a.availableCount); // Sort by most available first
}

function displayCustomTimetableResults(teacherAvailability, day, slotIndices) {

  heading.className = 'text-xl font-bold text-[#101418] mb-4';
  heading.textContent = `Teacher Availability for ${day}`;
  if (slotIndices.length === 6) {
    heading.textContent += ' (Full Day)';
  } else {
    heading.textContent += ` (Selected Time Slots)`;
  }
  resultsContainer.appendChild(heading);
  
  // Create summary cards
  const summaryDiv = document.createElement('div');
  summaryDiv.className = 'flex flex-wrap gap-4 mb-6';
  
  const totalTeachers = teacherAvailability.length;
  const fullyAvailable = teacherAvailability.filter(t => t.allAvailable).length;
  const partiallyAvailable = teacherAvailability.filter(t => t.someAvailable && !t.allAvailable).length;
  
  summaryDiv.innerHTML = `
    <div class="bg-white p-4 rounded-lg shadow-sm flex-1 min-w-[200px]">

      <div class="text-sm text-blue-600">Partially Available</div>
      <div class="text-2xl font-bold text-blue-700">${partiallyAvailable}</div>
    </div>
  `;
  resultsContainer.appendChild(summaryDiv);
  
  // Create a table
  const table = document.createElement('table');
  table.className = 'w-full bg-white rounded-lg shadow-sm';
  
  // ... (rest of the table creation code remains the same) ...
}

      function findAvailableTeachers() {
        const selectedDay = daySelect.value;
        const selectedTimeSlot = parseInt(timeSlotSelect.value);
        
        // Filter teachers who have "No class" at the selected time
        const availableTeachers = teachers.filter(teacher => {
          const daySchedule = teacher.timetable[selectedDay];
          return daySchedule && daySchedule[selectedTimeSlot] === "No class";
        });
        
        // Display results
        availabilityResults.innerHTML = "";
        
        if (availableTeachers.length === 0) {
          availabilityResults.innerHTML = `
            <div class="bg-white p-6 rounded-lg shadow-sm text-center">
              <p class="text-lg font-medium text-gray-700">No teachers available at this time</p>
              <p class="text-gray-500">All teachers have classes during ${timeSlots[selectedTimeSlot]} on ${selectedDay}</p>
            </div>
          `;
          return;
        }
        
        const heading = document.createElement("h3");
        heading.className = "text-xl font-bold text-[#101418] mb-4";
        heading.textContent = `Available Teachers for ${timeSlots[selectedTimeSlot]} on ${selectedDay}`;
        availabilityResults.appendChild(heading);
        
        availableTeachers.forEach(teacher => {
          const card = document.createElement("div");
          card.className = "teacher-card bg-white p-4 rounded-lg shadow-sm flex items-center gap-4";
          
          const icon = document.createElement("div");
          icon.className = "bg-blue-100 p-3 rounded-full";
      icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z"></path></svg>`;
          
          const info = document.createElement("div");
          info.className = "flex-1";
          info.innerHTML = `
            <p class="font-bold text-lg">${teacher.name}</p>
            <p class="text-gray-600">${teacher.subject}</p>
            <p class="text-sm text-gray-500">Department: ${teacher.dept}</p>
          `;
          
          card.appendChild(icon);
          card.appendChild(info);
          availabilityResults.appendChild(card);
        });
      }
