<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assista - Sign Up</title>
  <style>
    body {
      background: linear-gradient(to bottom, #f5fafe, #e6f0f9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    .signup-container {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 12px;
      background-color: #f0f4f8;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007BFF;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .logo {
      width: 70px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 30px;
    }

  </style>
</head>
<body>
  <div class="signup-container">
    <img src="assets/logo.jpg" alt="Logo" class="logo" />
    <div class="title">Assista</div>
    <div class="subtitle">Your Personal College Assistant</div>
    <h2>Create Account</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="text" id="rollNo" placeholder="Roll Number" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="tel" id="mobile" placeholder="Mobile Number" required pattern="[0-9]{10}">
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const rollNo = document.getElementById("rollNo").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      try {
        const response = await fetch("http://127.0.0.1:8000/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, rollNo, email, mobile, password })
        });

        const data = await response.json();
        
        if (response.ok) {
          message.style.color = "green";
          message.textContent = "Signup successful! Redirecting...";

          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } else {
          message.style.color = "red";
          message.textContent = data.detail || "Signup failed.";
        }
      } catch (error) {
        message.style.color = "red";
        message.textContent = "Error connecting to server.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
